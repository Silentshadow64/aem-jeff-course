name: Ready for Grading
description: Submit a week for professor grading
title: "Ready for Grading: <Your Name> — Week <##>"
labels: ["Ready-For-Grading"]
body:
  - type: input
    id: name
    attributes:
      label: Your name
      placeholder: "Jeff / Mattie / Melanie"
    validations:
      required: true
  - type: input
    id: week
    attributes:
      label: Week number
      placeholder: "01"
    validations:
      required: true
  - type: input
    id: pr
    attributes:
      label: Pull Request URL
      placeholder: "https://github.com/your/repo/pull/123"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes for the professor
      placeholder: "Anything you'd like me to know before grading."
